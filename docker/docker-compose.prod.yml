services:
  db:
    image: postgres:16
    env_file:
      - ../api/.env
    networks:
      - task_network
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    networks:
      - task_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    env_file:
      - ../api/.env
    networks:
      - task_network
    volumes:
      - ../api:/app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'').read(); print(''ok'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.api.conf:/etc/nginx/nginx.api.conf:ro
    networks:
      - task_network
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy

networks:
  task_network:
    driver: bridge

volumes:
  pg_data:
