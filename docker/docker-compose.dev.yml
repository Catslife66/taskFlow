services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: taskflow_api
    env_file:
      - ../api/.env
    networks:
      - task_network
    volumes:
      - ../api:/app
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: taskflow_db
    env_file:
      - ../api/.env
    networks:
      - task_network
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: taskflow_redis
    networks:
      - task_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: taskflow_frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
    networks:
      - task_network
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: taskflow_nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - task_network

networks:
  task_network:
    driver: bridge

volumes:
  pg_data:
