events {}

http {
    log_format taskflow '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time urt=$upstream_response_time '
                            'ua="$upstream_addr"';

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
	gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    client_max_body_size 2m;

    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_log_level warn;

    upstream api_upstream {
        server api:8000;
    }

    server {
        listen 80;
        server_name api.josiegal.co.uk;
        # ACME challenge for certbot (webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        # Redirect to HTTPS
        location / {
            return 301 https://$host$request_uri
        }
    }

    server {
        listen 433 ssl;
        server_name api.josiegal.co.uk;

        ssl_certificate     /etc/letsencrypt/live/api.josiegal.co.uk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.josiegal.co.uk/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        location / {
            proxy_pass http://api_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
        
    }
}