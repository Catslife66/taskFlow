events {}

http {
    # -------- Logs --------
    log_format taskflow '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time urt=$upstream_response_time '
                        'ua="$upstream_addr"';

    access_log /var/log/nginx/access.log taskflow;
    error_log  /var/log/nginx/error.log warn;

    # -------- Gzip --------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # -------- Limits --------
    client_max_body_size 2m;

    # -------- Rate limiting (zone defined; apply later with limit_req) --------
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_log_level warn;

    # -------- Upstream --------
    upstream api_upstream {
        server api:8000;
    }

    # =========================================================
    # HTTP (80): ACME challenge + redirect to HTTPS
    # =========================================================
    server {
        listen 80;
        server_name api.josiegal.co.uk;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================
    # HTTPS (443): Proxy to FastAPI
    # =========================================================

}